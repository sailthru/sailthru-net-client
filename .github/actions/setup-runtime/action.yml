name: Set up test runtime
description: Select a fixed .NET channel or the newest stable release, and expose its test framework.
inputs:
  version:
    description: SDK channel (for example 8.0.x) or current
    default: current
outputs:
  framework:
    description: Target framework that runs tests on the selected runtime
    value: ${{ steps.resolve.outputs.framework }}
runs:
  using: composite
  steps:
    - id: resolve
      uses: actions/github-script@v7
      env:
        REQUESTED_DOTNET: ${{ inputs.version }}
      with:
        script: |
          let version = process.env.REQUESTED_DOTNET;
          if (version === 'current') {
            const response = await fetch('https://builds.dotnet.microsoft.com/dotnet/release-metadata/releases-index.json', {
              signal: AbortSignal.timeout(30000)
            });
            if (!response.ok) throw new Error(`Runtime metadata request failed: ${response.status}`);
            const index = await response.json();
            const stable = index['releases-index']
              .filter(release => release.product === '.NET'
                && ['active', 'maintenance'].includes(release['support-phase'])
                && /^\d+\.\d+\.\d+$/.test(release['latest-sdk']))
              .sort((a, b) => parseFloat(b['channel-version']) - parseFloat(a['channel-version']));
            if (!stable.length) throw new Error('No supported stable .NET SDK found');
            version = stable[0]['latest-sdk'];
          }
          if (!/^\d+\.\d+\.(?:\d+|x)$/.test(version)) throw new Error(`Invalid SDK version: ${version}`);
          const [major, minor] = version.split('.');
          core.setOutput('sdk', version);
          core.setOutput('framework', `net${major}.${minor}`);
          core.info(`Testing on .NET ${major}.${minor} with SDK ${version}`);
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ steps.resolve.outputs.sdk }}
        dotnet-quality: ga
