# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: release

on:
  push:
    tags:        
      - '*'

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./Sailthru

    steps:
    - uses: actions/checkout@v4
    - name: Set up current stable test runtime
      id: runtime
      uses: ./.github/actions/setup-runtime
    - name: Verify tag is correct and fail if it doesn't match the version in project
      run: grep -q "${GITHUB_REF_NAME#?}" Sailthru/Sailthru.csproj
    - name: Restore dependencies
      run: dotnet restore -p:ClientTestFramework=${{ steps.runtime.outputs.framework }}
    - name: Build
      run: dotnet build --no-restore --configuration Release -p:ClientTestFramework=${{ steps.runtime.outputs.framework }}
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal -p:ClientTestFramework=${{ steps.runtime.outputs.framework }}
    - name: Test built NuGet package before publishing
      run: bash ../scripts/test-package.sh ${{ steps.runtime.outputs.framework }}
    - name: Publish the package to nuget.org
      run: dotnet nuget push */bin/Release/*.nupkg -k $NUGET_AUTH_TOKEN -s https://api.nuget.org/v3/index.json
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.NUGET_TOKEN }}